name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install cmake==4.2.3 ninja==1.13.0 meson==1.10.2
          brew install pkgconf nasm
      - uses: actions/cache@v5
        with:
          path: build/src
          key: macfreerdp-sources-${{ hashFiles('build.lock.json') }}
      - name: Build and verify portable application
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: python scripts/build_macos.py --arch "$TARGET_ARCH" --jobs 3
      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.arch }}
          path: |
            dist/MacFreeRDP-macos-${{ matrix.arch }}.dmg
            dist/MacFreeRDP-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.arch }}
          path: |
            build/smoke-*.log
            build/${{ matrix.arch }}/**/CMakeConfigureLog.yaml
            build/${{ matrix.arch }}/**/meson-log.txt

  merge-universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: slice-*
          path: build/slices
          merge-multiple: true
      - name: Check native disk images
        working-directory: build/slices
        run: shasum -a 256 -c ./*.sha256
      - name: Merge all binaries and sign Universal app
        run: >-
          python scripts/build_macos.py --merge-from
          build/slices/MacFreeRDP-macos-arm64.dmg
          build/slices/MacFreeRDP-macos-x86_64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: MacFreeRDP-macos-universal
          path: |
            dist/MacFreeRDP-macos-universal.dmg
            dist/MacFreeRDP-macos-universal.dmg.sha256
          if-no-files-found: error
          compression-level: 0

  verify-universal:
    needs: merge-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: MacFreeRDP-macos-universal
          path: build/download
      - name: Mount final DMG and verify app on its native architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cd build/download
          shasum -a 256 -c MacFreeRDP-macos-universal.dmg.sha256
          cd ../..
          python scripts/build_macos.py --verify-only build/download/MacFreeRDP-macos-universal.dmg --arch "$TARGET_ARCH"

  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify-universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: MacFreeRDP-macos-universal
          path: release-assets
      - name: Attach Universal DMG to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
